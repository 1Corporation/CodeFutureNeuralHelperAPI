# docker-compose.yml

services:

  backend:
    build:
      context: .
      dockerfile: dockerfiles/backend/Dockerfile
    tty: true
    depends_on:
      - ai
    command: sh -c "python3 manage.py migrate && python3 -u -m daphne backend.asgi:application -b backend -p 8000"
    restart: always
    expose:
      - 8000

  nginx:
      build:
          context: .
          dockerfile: ./dockerfiles/nginx/Dockerfile
      depends_on:
          - backend
          - frontend
      ports:
          - "80:80"
      volumes:
          - static:/static/

  frontend:
    build:
      context: .
      dockerfile: dockerfiles/frontend/Dockerfile
    volumes:
      - static:/dist/

  ai:
    build:
      context: .
      dockerfile: dockerfiles/ai/Dockerfile
    depends_on:
      - kafka
    tty: true
    command: sh -c "python3 main.py"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    build:
      context: .
      dockerfile: dockerfiles/kafka/Dockerfile
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    restart: always  # do not remove this! That's fix NodeExists error :pig:

  # Сервис создающий kafka-topic при создании сервера
  create-topic:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - kafka
    command: |
      bash -c "kafka-topics --bootstrap-server kafka:9092 --create --topic ai-topic --partitions 1 --replication-factor 1"


volumes:
  static:
    external: true